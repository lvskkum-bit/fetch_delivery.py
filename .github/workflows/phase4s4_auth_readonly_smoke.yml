name: Task 4S-4 Private Calendar Auth Smoke (READ ONLY)

on:
  push:
    branches:
      - correction/phase4-task4s4-auth-readonly-smoke
    paths:
      - .github/workflows/phase4s4_auth_readonly_smoke.yml
      - phase4_calendar_bridge.py
      - phase4_calendar_bridge_cli.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4s4-readonly-smoke
  cancel-in-progress: true

jobs:
  cross-repo-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated producer branch
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP dependency
        run: python -m pip install -q requests
      - name: Read-only approved private calendar artifact
        env:
          STOCK_MASTER_CALENDAR_READ_TOKEN: ${{ secrets.STOCK_MASTER_CALENDAR_READ_TOKEN }}
          # This is a ONE-TIME pinned authenticated smoke-test fixture.
          # This date/run must NOT be reused as proof of future sessions.
          PHASE4_CALENDAR_APPROVED_RUN_ID: '38078845264'
          PHASE4_CALENDAR_APPROVED_HEAD_SHA: '2420429da437de93c7f37263cbb07bbce52a3efe'
          PHASE4_APPROVED_COMPLETED_SESSION_DATE: '2026-10-09'
        run: |
          python - <<'PY'
          import json, os
          from phase4_calendar_bridge_cli import execute
          from phase4_calendar_bridge import CalendarBridgeError
          if not os.environ.get("STOCK_MASTER_CALENDAR_READ_TOKEN"):
              print("AUTHENTICATED_CALENDAR_SMOKE: WAIT — STOCK_MASTER_CALENDAR_READ_TOKEN_MISSING")
              raise SystemExit(2)
          try:
              proof=execute()
              assert proof["status"]=="PASS" and proof["production_write"] is False
              assert proof["session"]=="2026-10-09" and proof["run_id"]==38078845264
              print(json.dumps({"status":"PASS","test":"AUTHENTICATED_PRIVATE_CALENDAR_READ",
                  "completed_session":proof["session"],"production_write":False},
                  sort_keys=True))
          except (CalendarBridgeError, OSError, AssertionError) as err:
              # Error messages are only fixed code values; no payload/token logged.
              print("AUTHENTICATED_CALENDAR_SMOKE: WAIT — " + str(err).split(":")[-1])
              raise SystemExit(2)
          PY
      - name: Explicit production isolation
        if: always()
        run: |
          echo "The smoke test only reads a protected private GitHub Actions run and artifact."
          echo "No cache mutation, no producer workflow publish, no Sheet/Broker calls."
