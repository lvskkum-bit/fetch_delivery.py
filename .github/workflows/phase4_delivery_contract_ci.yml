name: Phase 4 Delivery Producer Parity (Isolated CI)
on:
  push:
    branches:
      - correction/phase4-live-delivery-source-parity
    paths:
      - fetch_delivery.py
      - fetch_nifty50_constituents.py
      - tests/test_phase4_delivery_source_parity.py
      - .github/workflows/delivery.yml
      - .github/workflows/phase4_delivery_contract_ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-delivery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -p 'test_phase4_delivery_source_parity.py' -v
      - run: python -m py_compile fetch_delivery.py fetch_nifty50_constituents.py
      - run: echo "Isolated CI only. No production cache publish, Sheet writes or broker action."
