name: Phase4S4 Artifact Redirect Host Probe (No Secrets Logged)

on:
  push:
    branches:
      - correction/phase4-task4s4-auth-readonly-smoke
    paths:
      - .github/workflows/phase4s4_redirect_hostname_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostname-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q requests
      - name: Identify GitHub artifact redirect HOSTNAME ONLY
        env:
          STOCK_MASTER_CALENDAR_READ_TOKEN: ${{ secrets.STOCK_MASTER_CALENDAR_READ_TOKEN }}
        run: |
          python - <<'PY'
          import os,requests
          from urllib.parse import urlsplit
          token=os.environ.get('STOCK_MASTER_CALENDAR_READ_TOKEN','')
          if not token:
              raise SystemExit('WAIT: SECRET_NOT_AVAILABLE')
          url='https://api.github.com/repos/lvskkum-bit/nifty50-stock-master-appsscript/actions/artifacts/11692701343/zip'
          reply=requests.get(url,headers={
              'Authorization':'Bearer '+token,
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28'
          },timeout=(3,15),allow_redirects=False)
          print('github_artifact_status:',reply.status_code)
          if reply.status_code not in (302,307):
              raise SystemExit('WAIT: GITHUB_ARTIFACT_REDIRECT_NOT_PROVIDED')
          location=reply.headers.get('Location','')
          parts=urlsplit(location)
          # DO NOT output location URL, querystring, full signed URL, or token.
          print('redirect_scheme:',parts.scheme)
          print('redirect_hostname_only:',parts.hostname)
          if parts.scheme!='https' or not parts.hostname:
              raise SystemExit('WAIT: INVALID_REDIRECT')
          PY
      - name: No release
        if: always()
        run: echo "Read-only metadata diagnostic. No signed URLs printed. No cache or production writes."
